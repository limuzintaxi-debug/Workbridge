<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="WORKBRIDGE">
  <title>WORKBRIDGE</title>
  <defs>
    <clipPath id="globe-clip"><circle cx="256" cy="256" r="236" /></clipPath>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCE3DF" />
      <stop offset="1" stop-color="#F7C4BB" />
    </linearGradient>
  </defs>

  <!-- Globe: light coral / pink -->
  <circle cx="256" cy="256" r="236" fill="url(#coral)" />
  <g clip-path="url(#globe-clip)" fill="none" stroke="#ffffff" stroke-width="7" opacity="0.85">
    <ellipse cx="256" cy="256" rx="118" ry="236" />
    <ellipse cx="256" cy="256" rx="58" ry="236" />
    <line x1="20" y1="256" x2="492" y2="256" />
    <ellipse cx="256" cy="256" rx="236" ry="92" />
    <ellipse cx="256" cy="256" rx="236" ry="176" />
  </g>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#EC9C8F" stroke-width="10" opacity="0.35" />

  <!-- W: dark navy blue -->
  <path
    d="M116 172 L168 364 L226 264 L284 364 L336 172"
    fill="none"
    stroke="#0B1F3A"
    stroke-width="46"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- B: golden yellow. Upper stroke extends into and crosses the W; lower bowl stays open. -->
  <path
    d="M292 172 H352 A44 44 0 0 1 352 260"
    fill="none"
    stroke="#F2B32B"
    stroke-width="44"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path d="M352 172 V364" fill="none" stroke="#F2B32B" stroke-width="44" stroke-linecap="round" />
  <path
    d="M352 272 A46 46 0 0 1 392 342"
    fill="none"
    stroke="#F2B32B"
    stroke-width="44"
    stroke-linecap="round"
  />
</svg>
