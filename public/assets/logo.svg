<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-label="WORKBRIDGE logo: letter W containing two joined hands">
  <title>WORKBRIDGE</title>
  <!--
    The approved WORKBRIDGE artwork is supplied as a raster image.
    It lives in this folder as logo.png and is used directly by the app
    (header, footer, sign-in and registration, dashboards, admin panel,
    documents, favicon and PWA manifest) so that the displayed mark is
    always the exact supplied pixels. This SVG only references that file;
    it never redraws, traces or re-colours the mark.
  -->
  <image href="logo.png" x="0" y="0" width="1536" height="1024" preserveAspectRatio="xMidYMid meet" />
</svg>
