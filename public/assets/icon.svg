<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="WORKBRIDGE app icon">
  <title>WORKBRIDGE</title>
  <!--
    Square app-icon presentation of the approved WORKBRIDGE artwork.
    The mark itself is the exact supplied image (logo.png), centred on the
    brand's white background. Nothing is redrawn or recoloured.
    Square 32/180/192/512 raster icons are produced from the same file by
    scripts/build-icons.js.
  -->
  <rect width="512" height="512" fill="#ffffff" />
  <image href="logo.png" x="26" y="128" width="460" height="256" preserveAspectRatio="xMidYMid meet" />
</svg>
